<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Claude video effects</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- Set data-duration (here, #plate and #me) to the clip length. -->
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="30">

  <div id="plate-wrap" class="layer"><video id="plate" class="clip fill" src="src/clip.mp4" playsinline data-has-audio="true" data-start="0" data-duration="30" data-track-index="0" data-volume="1"></video></div>

  <div id="behind" class="layer">
    <!-- FX: behind-the-speaker HTML goes here -->
  </div>

  <div id="me-wrap" class="layer"><video id="me" class="clip fill" src="src/me.webm" muted playsinline data-start="0" data-duration="30" data-track-index="1"></video></div>

  <div id="front" class="layer">
    <!-- FX: in-front-of-the-speaker HTML goes here -->
    <div id="chip" class="chip"></div>
    <div id="captions"></div>
  </div>

  <div id="flash" class="layer"></div>
  <div id="vignette" class="layer"></div>

  <!-- FX: <audio> sound effects go here (each needs an id) -->
</div>
<script>
const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const tl = gsap.timeline({ paused: true });

// Captions: [start, end, "TEXT with <em>accent</em>"] from tools/words.py
const CAPS = [
  [0.0, 1.0, "PASTE <em>CAPTIONS</em>"],
];
CAPS.forEach(([a, b, t]) => {
  const c = el("div", "cap", t);
  $("#captions").append(c);
  tl.fromTo(c, { opacity: 0, y: 26, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "back.out(2.5)" }, a);
  tl.to(c, { opacity: 0, duration: 0.08 }, b - 0.06);
});

// Effect name chip: chip(start, end, "orbit") shows "/orbit" under the speaker.
const chip = (a, b, name) => {
  tl.call(() => { $("#chip").innerHTML = `<b>/</b>${name}`; }, null, a);
  tl.fromTo("#chip", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.15, ease: "power3.out", immediateRender: false }, a);
  tl.to("#chip", { opacity: 0, duration: 0.1 }, b);
};

// FX: effects go here

window.__timelines["main"] = tl;
</script>
</body>
</html>
